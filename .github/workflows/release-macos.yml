name: PKMediaDownloader Stable release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Import Developer ID certificate and notarization key
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12"
          test -n "$APPLE_API_KEY"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k build.keychain-db -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain-db
          security list-keychains -d user -s build.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning build.keychain-db | sed -nE 's/.*"(Developer ID Application:[^"]+)"/\1/p' | head -1)"
          test -n "$IDENTITY"
          echo "MEDIA_DOWNLOADER_DEVELOPER_ID=$IDENTITY" >> "$GITHUB_ENV"
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER_ID=$APPLE_API_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Verify main contains tagged release commit
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Build and publish notarized release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./script/release_macos.sh "$GITHUB_REF_NAME"

      - name: Sign Stable appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          ARCH="$(uname -m)"
          DMG="dist/release/PKMediaDownloader-$TAG-macos-$ARCH.dmg"
          BUNDLE_VERSION="$(printf '%s' "$VERSION" | tr -cd '0-9')"
          awk 'BEGIN{p=0} /^## \[/{if(p)exit; p=1; next} p&&/^## /{exit} p' CHANGELOG.md > /tmp/notes.md
          python3 -m venv /tmp/sv
          /tmp/sv/bin/pip -q install cryptography
          /tmp/sv/bin/python script/sparkle_release.py "$DMG" "$TAG" "$VERSION" "$BUNDLE_VERSION" mondary/media-downloader PKMediaDownloader 14.0 /tmp/notes.md

      - name: Publish Stable appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add appcast.xml
          git commit -m "MAJ: appcast media downloader $GITHUB_REF_NAME" || exit 0
          git fetch origin main
          git rebase origin/main
          git push "https://x-access-token:${GH_TOKEN}@github.com/mondary/media-downloader.git" HEAD:main
